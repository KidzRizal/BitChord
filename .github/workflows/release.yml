name: Build & Release

# Manual only. Nothing here runs on a push, a tag or a schedule: start it from
# Actions > Build & Release > Run workflow and tick what to build. Publishing is
# its own toggle, off by default, and even then only makes a *draft* release
# that still has to be published by hand.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (e.g. 1.9.1-meng.3)"
        required: true
      desktop_version:
        description: "Desktop version stamp (blank = same as version)"
        required: false
        default: ""
      desktop_ref:
        description: "Branch/tag holding desktopApp (main has none)"
        required: true
        default: "desktop-discord"
      build_android:
        description: "Build Android APKs"
        type: boolean
        default: true
      build_windows:
        description: "Build Windows (setup.exe, msi, portable zip)"
        type: boolean
        default: false
      build_linux:
        description: "Build Linux (AppImage, deb, rpm)"
        type: boolean
        default: false
      run_tests:
        description: "Run the desktop unit tests first"
        type: boolean
        default: false
      publish_release:
        description: "Create a DRAFT GitHub release with the files (never auto-published)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  android:
    name: Android · signed APKs
    if: inputs.build_android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties and the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          {
            echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}"
            echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}"
            echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}"
            echo "DISCORD_APPLICATION_ID=${{ secrets.DISCORD_APPLICATION_ID }}"
          } > local.properties
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set; refusing to ship unsigned APKs"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > bitchord-release.jks
          {
            echo "storeFile=bitchord-release.jks"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties

      - run: chmod +x gradlew

      - name: Build signed prod release APKs
        run: ./gradlew :app:assembleProdRelease

      - name: Collect
        run: |
          v=${{ inputs.version }}
          mkdir -p dist
          for apk in app/build/outputs/apk/prod/release/*.apk; do
            for abi in arm64-v8a armeabi-v7a x86_64 universal; do
              case "$apk" in *"$abi"*) cp "$apk" "dist/BitChord-$v-$abi.apk" ;; esac
            done
          done
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: dist/*

  linux:
    name: Linux · AppImage, deb, rpm
    if: inputs.build_linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.desktop_ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        run: |
          version="${{ inputs.desktop_version }}"
          [ -n "$version" ] || version="${{ inputs.version }}"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Write local.properties
        run: |
          {
            echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}"
            echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}"
            echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}"
            echo "DISCORD_APPLICATION_ID=${{ secrets.DISCORD_APPLICATION_ID }}"
          } > local.properties

      - name: Packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot binutils file cmake g++
          curl -sSL -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage

      - run: chmod +x gradlew

      - name: Tests
        if: inputs.run_tests
        run: ./gradlew :shared:jvmTest :desktopApp:test -Pbitchord.version=${{ steps.version.outputs.value }}

      - name: Build deb, rpm and the app image
        run: |
          ./gradlew :desktopApp:packageDeb :desktopApp:packageRpm :desktopApp:createDistributable \
            -Pbitchord.version=${{ steps.version.outputs.value }}

      - name: The analyser and models are in the jar
        run: |
          jar=$(ls desktopApp/build/compose/binaries/main/app/BitChord/lib/app/desktopApp*.jar)
          jar tf "$jar" | grep -q 'native/libbitchord_analysis.so'
          jar tf "$jar" | grep -q 'models/.*\.onnx'

      - name: Build the AppImage and collect
        run: |
          v=${{ steps.version.outputs.value }}
          mkdir -p dist
          desktopApp/packaging/appimage.sh \
            desktopApp/build/compose/binaries/main/app/BitChord \
            "dist/BitChord-desktop-$v-linux-x86_64.AppImage" \
            "$PWD/appimagetool.AppImage"
          cp desktopApp/build/compose/binaries/main/deb/*.deb "dist/BitChord-desktop-$v-linux-amd64.deb"
          cp desktopApp/build/compose/binaries/main/rpm/*.rpm "dist/BitChord-desktop-$v-linux-x86_64.rpm"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: dist/*

  windows:
    name: Windows · installer, msi, portable
    if: inputs.build_windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.desktop_ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: WiX Toolset 3
        shell: pwsh
        run: |
          $url = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
          Invoke-WebRequest -Uri $url -OutFile wix.zip
          Expand-Archive wix.zip -DestinationPath "$env:RUNNER_TEMP\wix"
          "$env:RUNNER_TEMP\wix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Work out the version
        id: version
        shell: bash
        run: |
          version="${{ inputs.desktop_version }}"
          [ -n "$version" ] || version="${{ inputs.version }}"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Write local.properties
        shell: bash
        run: |
          {
            echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}"
            echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}"
            echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}"
            echo "DISCORD_APPLICATION_ID=${{ secrets.DISCORD_APPLICATION_ID }}"
          } > local.properties

      - name: Tests
        if: inputs.run_tests
        run: .\gradlew.bat :shared:jvmTest :desktopApp:test "-Pbitchord.version=${{ steps.version.outputs.value }}"

      - name: Build msi, exe and the app image
        run: |
          .\gradlew.bat :desktopApp:packageMsi :desktopApp:packageExe :desktopApp:createDistributable "-Pbitchord.version=${{ steps.version.outputs.value }}"

      - name: Collect
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.value }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item desktopApp/build/compose/binaries/main/msi/*.msi "dist/BitChord-desktop-$v-windows-x64.msi"
          Copy-Item desktopApp/build/compose/binaries/main/exe/*.exe "dist/BitChord-desktop-$v-windows-x64-setup.exe"
          7z a -tzip -mx=5 "dist/BitChord-desktop-$v-windows-x64-portable.zip" `
            "desktopApp/build/compose/binaries/main/app/BitChord/*" | Out-Null
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/*

  release:
    name: Draft release
    needs: [android, linux, windows]
    # Runs when publishing was asked for and every *selected* job succeeded.
    if: >-
      always() && inputs.publish_release &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-artifacts"
          merge-multiple: true
          path: dist

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          ls -lh

      - name: Draft the release (not published)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: BitChord ${{ inputs.version }}
          draft: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
